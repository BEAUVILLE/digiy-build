<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DIGIY BUILD — Gestion DIGIY</title>
<style>
:root{--bg:#f6f1e5;--card:#fffefa;--ink:#173b31;--muted:#6e8179;--line:#dfe8e2;--green:#073f32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui}.wrap{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.meta{color:var(--muted);font-size:13px}.need{white-space:pre-wrap}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff8df;border:1px solid #ead28a;font-size:12px;font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button,.logout{border:0;border-radius:999px;padding:9px 12px;font-weight:900;cursor:pointer}.ok{background:#0f6b4f;color:#fff}.bad{background:#7d2f2f;color:#fff}.plain{background:#ece7d8;color:#173b31}select{width:100%;max-width:520px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:white}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><div class="meta">🛠️ DIGIY BUILD</div><h1>Gestion DIGIY</h1></div><button class="logout" id="logout">Déconnexion</button></div>
<p>Demandes BUILD reçues avant confirmation, affectation et clôture.</p>
<div id="status" class="card">Chargement…</div>
<div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js"></script>
<script>
const sb=supabase.createClient("https://wesqmwjjtsefyjnluosj.supabase.co","sb_publishable_tGHItRgeWDmGjnd0CK1DVQ_BIep4Ug3");
const statusBox=document.getElementById("status"),list=document.getElementById("list");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const labels={pending:"En attente",confirmed:"Confirmée",done:"Terminée",cancelled:"Annulée"};
let profiles=[];
async function boot(){
 const {data:{user}}=await sb.auth.getUser();
 if(!user){location.replace("./acces-digiy.html");return}
 const {data:ok,error:ae}=await sb.rpc("digiy_build_admin_access_v1");
 if(ae||ok!==true){await sb.auth.signOut();location.replace("./acces-digiy.html");return}
 const pr=await sb.rpc("digiy_build_admin_profiles_v1");
 profiles=pr.data||[];
 const {data,error}=await sb.rpc("digiy_build_admin_requests_v1");
 if(error){statusBox.textContent="⚠️ "+error.message;return}
 statusBox.textContent=(data||[]).length+" demande(s)";
 list.innerHTML=(data||[]).map(r=>{
   const options=['<option value="">— Choisir un artisan —</option>'].concat(profiles.map(p=>'<option value="'+esc(p.slug)+'" '+(r.assigned_pro_slug===p.slug?'selected':'')+'>'+esc(p.display_name)+' · '+esc(p.trade||"")+' · '+esc(p.zone||p.city||"")+'</option>')).join("");
   return '<article class="card"><div><strong>'+esc(r.type_travaux||"Besoin BUILD")+'</strong> · '+esc(r.client_nom||"")+'</div><div class="meta">'+esc(r.client_ville||"")+(r.desired_date?' · '+esc(r.desired_date):'')+' · '+esc(r.urgence||"")+'</div><p class="need">'+esc(r.description_projet||"")+'</p><div class="meta">☎ '+esc(r.client_phone||"")+(r.budget_estime?' · Budget indiqué : '+esc(r.budget_estime)+' FCFA':'')+'</div><p><span class="status">'+esc(labels[r.status]||r.status||"pending")+'</span></p><select id="pro-'+esc(r.id)+'">'+options+'</select><div class="actions"><button class="ok" data-action="confirmed" data-id="'+esc(r.id)+'">✅ Confirmer</button><button class="plain" data-action="assign" data-id="'+esc(r.id)+'">👷 Affecter</button><button class="plain" data-action="done" data-id="'+esc(r.id)+'">🏁 Terminer</button><button class="bad" data-action="cancelled" data-id="'+esc(r.id)+'">❌ Annuler</button></div></article>';
 }).join("")||'<div class="card">Aucune demande reçue.</div>';
 document.querySelectorAll("[data-action]").forEach(btn=>btn.onclick=()=>handle(btn.dataset.id,btn.dataset.action));
}
async function handle(id,action){
 const sel=document.getElementById("pro-"+id);
 const slug=sel?.value||null;
 let status=action;
 if(action==="assign"){
   if(!slug){alert("Choisis d’abord un artisan.");return}
   status="confirmed";
 }
 const {error}=await sb.rpc("digiy_build_admin_set_request_v1",{p_id:id,p_status:status,p_assigned_pro_slug:slug});
 if(error){alert("⚠️ "+error.message);return}
 await boot();
}
document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.replace("./acces-digiy.html")};
boot();
</script>
</body>
</html>
