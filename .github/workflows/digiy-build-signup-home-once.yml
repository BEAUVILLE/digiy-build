name: Correct BUILD signup home once
on:
  push:
    paths: ['.github/workflows/digiy-build-signup-home-once.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inscription-build.html')
          if p.exists():
              s=p.read_text(encoding='utf-8'); before=s
              s=s.replace('https://digiy-hub.digiylyfe.com/','https://digiylyfe.com/').replace('./digiy-hub/','https://digiylyfe.com/')
              s=s.replace('🧭 HUB','🏠 DIGIYLYFE').replace('← Retour DIGIY Hub','← Retour DIGIYLYFE')
              if s!=before: p.write_text(s,encoding='utf-8')
          PY
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/digiy-build-signup-home-once.yml
          git add -A
          git commit -m "Navigation: fix BUILD signup return to DIGIYLYFE home"
          git push origin HEAD:main
