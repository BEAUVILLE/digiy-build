name: Install BUILD V2 stable masters
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-build-v2-stable-masters.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch index surgically
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<script src="https://digiylyfe.com/assets/digiy-mbaye-diouf-signature-v1.js?v=20260829-v1" defer></script>\n<script src="https://digiylyfe.com/assets/digiy-helage-signature-v1.js?v=20260829-v1" defer></script>\n<script src="/assets/digiy-build-departements-v1.js?v=20260829-v1" defer></script>\n<script src="/assets/digiy-build-solaire-connector-v1.js?v=20260829-v1" defer></script>'''
          new='''<script src="https://digiylyfe.com/assets/digiy-mbaye-diouf-signature-v1.js?v=20260829-v1" defer></script>\n<script src="https://digiylyfe.com/assets/digiy-helage-signature-v1.js?v=20260829-v1" defer></script>\n<script src="https://digiylyfe.com/assets/digiy-babacar-plombier-signature-v1.js?v=20260829-v1" defer></script>\n<script src="https://digiylyfe.com/assets/digiy-kourant-electricien-signature-v1.js?v=20260829-v1" defer></script>\n<script src="/assets/digiy-build-departements-v2.js?v=20260829-v2" defer></script>\n<script src="/assets/digiy-build-solaire-connector-v2.js?v=20260829-v2" defer></script>'''
          if old not in s:
              raise SystemExit('STOP: bloc loaders V1 exact introuvable')
          s=s.replace(old,new,1)
          s=s.replace('aria-label="Voir la carte de ', 'aria-label="Voir la fiche de ')
          s=s.replace('data-i18n="card">VOIR LA CARTE</span>', 'data-i18n="fiche">VOIR LA FICHE</span>')
          s=s.replace('data-i18n="card">VOIR LA CARTE</a>', 'data-i18n="fiche">VOIR LA FICHE</a>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify locks
        run: |
          grep -q 'digiy-babacar-plombier-signature-v1.js' index.html
          grep -q 'digiy-kourant-electricien-signature-v1.js' index.html
          grep -q 'digiy-build-departements-v2.js' index.html
          grep -q 'digiy-build-solaire-connector-v2.js' index.html
          ! grep -q 'digiy-build-departements-v1.js' index.html
          ! grep -q 'digiy-build-solaire-connector-v1.js' index.html
          grep -q 'digiy-mbaye-diouf-signature-v1.js' index.html
          grep -q 'digiy-helage-signature-v1.js' index.html
          grep -q 'babacar-plombier-pro.digiylyfe.com' index.html
          grep -q 'kourant.digiylyfe.com' index.html
      - name: Commit final patch and remove installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/install-build-v2-stable-masters.yml
          git add index.html
          git commit -m 'Stabilize BUILD departments and install Babacar Kourant masters [skip ci]'
          git push origin main
