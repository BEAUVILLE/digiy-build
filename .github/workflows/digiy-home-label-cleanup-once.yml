name: Clean duplicate home labels once
on:
  push:
    paths: ['.github/workflows/digiy-home-label-cleanup-once.yml']
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['request.html','inscription.html','inscription-lang.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8'); before=s
              s=s.replace('https://digiy-hub.digiylyfe.com/','https://digiylyfe.com/').replace('./digiy-hub/','https://digiylyfe.com/')
              s=s.replace('<a class="btn secondary" href="https://digiylyfe.com/">🌍 Site</a>\n            <a class="btn secondary" href="https://digiylyfe.com/">🏠 DIGIYLYFE</a>','<a class="btn secondary" href="https://digiylyfe.com/">🏠 DIGIYLYFE</a>')
              if s!=before: p.write_text(s,encoding='utf-8')
          PY
          git config user.name "DIGIYLYFE maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/digiy-home-label-cleanup-once.yml
          git add -A
          git commit -m "Navigation: remove duplicate home labels from BUILD"
          git push origin HEAD:main
