name: Install DIGIY SOLAIRE connector

on:
  push:
    paths:
      - '.github/workflows/install-build-solaire-connector-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch BUILD index only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="/assets/digiy-build-departements-v1.js?v=20260829-v1" defer></script>'
          new=old+'\n<script src="/assets/digiy-build-solaire-connector-v1.js?v=20260829-v1" defer></script>'
          if 'digiy-build-solaire-connector-v1.js' not in s:
              if old not in s:
                  raise SystemExit('STOP: departments loader not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          assert 'digiy-build-departements-v1.js' in s
          assert 'digiy-build-solaire-connector-v1.js' in s
          assert 'digiy-mbaye-diouf-signature-v1.js' in s
          assert 'digiy-helage-signature-v1.js' in s
          PY
      - name: Commit validated scope
        run: |
          if git diff --quiet -- index.html; then
            echo 'Already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Install DIGIY SOLAIRE connector [skip ci]'
          git push origin main
