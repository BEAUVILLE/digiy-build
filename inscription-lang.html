<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#061b14">
  <title>DIGIY BUILD — Tarifs adhérents</title>
  <noscript><meta http-equiv="refresh" content="0;url=https://digiylyfe.com/tarifs-adherents-1.html?country=sn"></noscript>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#061b14;color:#fff;font:700 16px/1.5 system-ui,Arial,sans-serif">
  <main style="text-align:center;padding:24px">
    <p>Redirection vers les tarifs adhérents DIGIYLYFE…</p>
    <a id="tarifs" href="https://digiylyfe.com/tarifs-adherents-1.html?country=sn" style="color:#facc15">Ouvrir les tarifs adhérents →</a>
  </main>
  <script>
    (function(){
      var query=new URLSearchParams(location.search);
      var l=String(query.get("lang")||"").toLowerCase();
      var supported=["fr","en","es","pt","de","it","nl","ar"];
      try{if(!supported.includes(l))l=String(localStorage.getItem("digiy-lang")||"").toLowerCase()}catch(e){}
      if(!supported.includes(l))l="fr";
      var country=String(query.get("country")||query.get("pays")||"").toLowerCase();
      if(!country){try{country=String(localStorage.getItem("digiy_build_country_v1")||"").toLowerCase()}catch(e){}}
      country=country==="fr"||country==="france"?"fr":country==="us"||country==="usa"?"us":"sn";
      var target=new URL("https://digiylyfe.com/tarifs-adherents-1.html");
      target.searchParams.set("country",country);
      target.searchParams.set("lang",l);
      document.getElementById("tarifs").href=target.toString();
      location.replace(target.toString());
    })();
  </script>
</body>
</html>
